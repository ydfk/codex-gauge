name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer, for example v0.1.0" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY }}
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD }}
      CODEX_GAUGE_UPDATER_PUBKEY: ${{ vars.NATIVE_WINDOWS_UPDATER_PUBKEY || secrets.NATIVE_WINDOWS_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect optional updater signing
        id: signing
        shell: pwsh
        run: |
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:NATIVE_WINDOWS_SIGNING_PRIVATE_KEY)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:CODEX_GAUGE_UPDATER_PUBKEY)
          $enabled = $hasPrivateKey -and $hasPublicKey
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Warning "Updater signing is not fully configured. The portable EXE will still be released without latest.json or signature artifacts."
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-windows/target
            native-windows/tools/sign-update/target
          key: ${{ runner.os }}-windows-x64-${{ hashFiles('native-windows/Cargo.lock', 'native-windows/tools/sign-update/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-x64-

      - name: Set version
        shell: pwsh
        run: |
          $path = "native-windows/Cargo.toml"
          $content = Get-Content $path -Raw
          $replacement = '$1"' + '${{ needs.metadata.outputs.version }}' + '"'
          $content = $content -replace '(?m)^(version\s*=\s*)"[^"]+"', $replacement
          Set-Content $path $content -Encoding utf8

          $lockPath = "native-windows/Cargo.lock"
          $lock = Get-Content $lockPath -Raw
          $lockReplacement = '${1}' + '${{ needs.metadata.outputs.version }}' + '"'
          $lock = $lock -replace '(?ms)(\[\[package\]\]\r?\nname = "codex-gauge-native"\r?\nversion = ")[^"]+"', $lockReplacement
          Set-Content $lockPath $lock -Encoding utf8

      - name: Check and build native client
        shell: pwsh
        run: |
          cargo fmt --manifest-path native-windows/Cargo.toml --check
          cargo test --manifest-path native-windows/Cargo.toml --release --locked
          cargo build --manifest-path native-windows/Cargo.toml --release --locked --bin codex-gauge-native

      - name: Prepare portable package
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ needs.metadata.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          Copy-Item "native-windows/target/release/codex-gauge-native.exe" $asset

      - name: Sign portable package and create manifest
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $dist = Get-Item native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ needs.metadata.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          cargo run --manifest-path native-windows/tools/sign-update/Cargo.toml --release --locked -- $asset "$asset.sig"
          if (-not (Test-Path "$asset.sig")) {
            throw "Native updater signature was not generated"
          }

          $encodedName = [Uri]::EscapeDataString($assetName)
          $manifest = [ordered]@{
            version = "${{ needs.metadata.outputs.version }}"
            notes = "Codex Gauge ${{ needs.metadata.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$asset.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.metadata.outputs.tag }}/$encodedName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$($dist.FullName)\latest.json" -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            native-windows/dist/*.portable.exe
            native-windows/dist/*.sig
            native-windows/dist/latest.json
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - metadata
      - windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Codex Gauge ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/**
