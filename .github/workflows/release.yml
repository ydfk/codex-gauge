name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY }}
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD }}
      CODEX_GAUGE_UPDATER_PUBKEY: ${{ vars.NATIVE_WINDOWS_UPDATER_PUBKEY || secrets.NATIVE_WINDOWS_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be SemVer, for example v0.1.0"
          }
          if ([string]::IsNullOrWhiteSpace($env:NATIVE_WINDOWS_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret NATIVE_WINDOWS_SIGNING_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:CODEX_GAUGE_UPDATER_PUBKEY)) {
            throw "Repository variable or secret NATIVE_WINDOWS_UPDATER_PUBKEY is required"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-windows/target
            native-windows/tools/sign-update/target
          key: ${{ runner.os }}-windows-x64-${{ hashFiles('native-windows/Cargo.lock', 'native-windows/tools/sign-update/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-x64-

      - name: Set version
        shell: pwsh
        run: |
          $path = "native-windows/Cargo.toml"
          $content = Get-Content $path -Raw
          $replacement = '$1"' + '${{ steps.meta.outputs.version }}' + '"'
          $content = $content -replace '(?m)^(version\s*=\s*)"[^"]+"', $replacement
          Set-Content $path $content -Encoding utf8

          $lockPath = "native-windows/Cargo.lock"
          $lock = Get-Content $lockPath -Raw
          $lockReplacement = '${1}' + '${{ steps.meta.outputs.version }}' + '"'
          $lock = $lock -replace '(?ms)(\[\[package\]\]\r?\nname = "codex-gauge-native"\r?\nversion = ")[^"]+"', $lockReplacement
          Set-Content $lockPath $lock -Encoding utf8

      - name: Check and build native client
        shell: pwsh
        run: |
          cargo fmt --manifest-path native-windows/Cargo.toml --check
          cargo test --manifest-path native-windows/Cargo.toml --release --locked
          cargo build --manifest-path native-windows/Cargo.toml --release --locked --bin codex-gauge-native

      - name: Sign portable package and create manifest
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ steps.meta.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          Copy-Item "native-windows/target/release/codex-gauge-native.exe" $asset
          cargo run --manifest-path native-windows/tools/sign-update/Cargo.toml --release --locked -- $asset "$asset.sig"
          if (-not (Test-Path "$asset.sig")) {
            throw "Native updater signature was not generated"
          }

          $encodedName = [Uri]::EscapeDataString($assetName)
          $manifest = [ordered]@{
            version = "${{ steps.meta.outputs.version }}"
            notes = "Codex Gauge ${{ steps.meta.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$asset.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/$encodedName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$($dist.FullName)\latest.json" -Encoding utf8

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Codex Gauge ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            native-windows/dist/*.portable.exe
            native-windows/dist/*.sig
            native-windows/dist/latest.json
