name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer, for example v0.1.0" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY }}
      NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NATIVE_WINDOWS_SIGNING_PRIVATE_KEY_PASSWORD }}
      CODEX_GAUGE_UPDATER_PUBKEY: ${{ vars.NATIVE_WINDOWS_UPDATER_PUBKEY || secrets.NATIVE_WINDOWS_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect optional updater signing
        id: signing
        shell: pwsh
        run: |
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:NATIVE_WINDOWS_SIGNING_PRIVATE_KEY)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:CODEX_GAUGE_UPDATER_PUBKEY)
          $enabled = $hasPrivateKey -and $hasPublicKey
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Warning "Updater signing is not fully configured. The portable EXE will still be released without latest.json or signature artifacts."
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-windows/target
            native-windows/tools/sign-update/target
          key: ${{ runner.os }}-windows-x64-${{ hashFiles('native-windows/Cargo.lock', 'native-windows/tools/sign-update/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-x64-

      - name: Set version
        shell: pwsh
        run: |
          $path = "native-windows/Cargo.toml"
          $content = Get-Content $path -Raw
          $replacement = '$1"' + '${{ needs.metadata.outputs.version }}' + '"'
          $content = $content -replace '(?m)^(version\s*=\s*)"[^"]+"', $replacement
          Set-Content $path $content -Encoding utf8

          $lockPath = "native-windows/Cargo.lock"
          $lock = Get-Content $lockPath -Raw
          $lockReplacement = '${1}' + '${{ needs.metadata.outputs.version }}' + '"'
          $lock = $lock -replace '(?ms)(\[\[package\]\]\r?\nname = "codex-gauge-native"\r?\nversion = ")[^"]+"', $lockReplacement
          Set-Content $lockPath $lock -Encoding utf8

      - name: Check and build native client
        shell: pwsh
        run: |
          cargo fmt --manifest-path native-windows/Cargo.toml --check
          cargo test --manifest-path native-windows/Cargo.toml --release --locked
          cargo build --manifest-path native-windows/Cargo.toml --release --locked --bin codex-gauge-native

      - name: Prepare portable package
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ needs.metadata.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          Copy-Item "native-windows/target/release/codex-gauge-native.exe" $asset

      - name: Sign portable package and create manifest
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $dist = Get-Item native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ needs.metadata.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          cargo run --manifest-path native-windows/tools/sign-update/Cargo.toml --release --locked -- $asset "$asset.sig"
          if (-not (Test-Path "$asset.sig")) {
            throw "Native updater signature was not generated"
          }

          $encodedName = [Uri]::EscapeDataString($assetName)
          $manifest = [ordered]@{
            version = "${{ needs.metadata.outputs.version }}"
            notes = "Codex Gauge ${{ needs.metadata.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$asset.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.metadata.outputs.tag }}/$encodedName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$($dist.FullName)\latest.json" -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            native-windows/dist/*.portable.exe
            native-windows/dist/*.sig
            native-windows/dist/latest.json
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path="$(
            find /Applications \
              -maxdepth 1 \
              \( -type d -o -type l \) \
              -name 'Xcode_26*.app' \
              ! -name '*beta*' \
              ! -name '*RC*' \
              -print |
              sort |
              tail -n 1
          )"
          if [[ -z "$xcode_path" ]]; then
            echo "A stable Xcode 26 installation was not found on the runner." >&2
            exit 1
          fi

          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode_path/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Validate macOS release configuration
        shell: bash
        run: |
          required_names=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_NOTARY_API_KEY_P8
            SPARKLE_PRIVATE_KEY
            APPLE_TEAM_ID
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
            SPARKLE_PUBLIC_ED_KEY
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required macOS release configuration: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/codex-gauge-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          echo "::add-mask::$keychain_password"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' |
              head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "Developer ID Application identity was not found in the imported certificate." >&2
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare private release configuration
        shell: bash
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            echo "// 由 GitHub Actions 临时生成，不提交到仓库。"
            echo "SPARKLE_PUBLIC_ED_KEY = $SPARKLE_PUBLIC_ED_KEY"
          } > native-macos/Config/Local.xcconfig

          echo "APPLE_NOTARY_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, notarize and package macOS release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.metadata.outputs.tag }}/
        run: native-macos/scripts/release.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            native-macos/build/update/*.dmg
            native-macos/build/update/appcast.xml
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f native-macos/Config/Local.xcconfig

  release:
    name: Publish release
    needs:
      - metadata
      - windows-x64
      - macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Codex Gauge ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.metadata.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/**
