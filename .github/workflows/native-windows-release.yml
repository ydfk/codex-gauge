name: native-windows-release

on:
  push:
    tags:
      - "native-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Native release tag, for example native-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    name: Native Windows x64
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CODEX_GAUGE_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          if ($tag -notmatch '^native-v\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Native release tag must be SemVer, for example native-v0.1.0"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:CODEX_GAUGE_UPDATER_PUBKEY)) {
            throw "Repository variable or secret TAURI_UPDATER_PUBKEY is required"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(8))" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-windows/target
          key: ${{ runner.os }}-native-x64-${{ hashFiles('native-windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-x64-

      - name: Install signer
        run: pnpm install --frozen-lockfile

      - name: Set native version
        shell: pwsh
        run: |
          $path = "native-windows/Cargo.toml"
          $content = Get-Content $path -Raw
          $replacement = '$1"' + '${{ steps.meta.outputs.version }}' + '"'
          $content = $content -replace '(?m)^(version\s*=\s*)"[^"]+"', $replacement
          Set-Content $path $content -Encoding utf8

      - name: Check and build native client
        shell: pwsh
        run: |
          cargo fmt --manifest-path native-windows/Cargo.toml --check
          cargo test --manifest-path native-windows/Cargo.toml --release
          cargo build --manifest-path native-windows/Cargo.toml --release

      - name: Sign portable package and create manifest
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force native-windows/dist
          $assetName = "Codex.Gauge.Native_${{ steps.meta.outputs.version }}_x64.portable.exe"
          $asset = Join-Path $dist.FullName $assetName
          Copy-Item "native-windows/target/release/codex-gauge-native.exe" $asset
          pnpm tauri signer sign $asset
          if (-not (Test-Path "$asset.sig")) {
            throw "Native updater signature was not generated"
          }

          $encodedName = [Uri]::EscapeDataString($assetName)
          $manifest = [ordered]@{
            version = "${{ steps.meta.outputs.version }}"
            notes = "Codex Gauge Native ${{ steps.meta.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$asset.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/$encodedName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$($dist.FullName)\latest-native-windows.json" -Encoding utf8

      - name: Publish versioned native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Codex Gauge Native ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          make_latest: false
          generate_release_notes: true
          files: |
            native-windows/dist/*.portable.exe
            native-windows/dist/*.sig
            native-windows/dist/latest-native-windows.json

      - name: Update fixed native manifest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create native-latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Codex Gauge Native latest" --notes "Native Windows updater manifest." --latest=false
          }
          gh release upload native-latest native-windows/dist/latest-native-windows.json --repo "${{ github.repository }}" --clobber
